# Keep the fingerprint driver alive.
#
# python-validity exits when a libusb call fails, and a verify that is in flight
# when the machine suspends produces that failure. It exits with status 0, so the
# packaged Restart=on-failure never brings it back. The packaged udev rule starts
# the driver on a USB add or change event, and a resume that only resets the
# device does not emit one, so nothing else notices either.
#
# The driver refuses to start more than ten times per minute on its own, so
# RestartSec stays well under that rate.
[Service]
Restart=always
RestartSec=10
